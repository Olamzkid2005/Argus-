name: lint

on:
  push:
    branches: [master, Argus-Tui]
  pull_request:
    branches: [master, Argus-Tui]
  schedule:
    - cron: '0 6 * * *'   # Nightly at 06:00 UTC — full fixture matrix
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  BUN_INSTALL_FLAGS: --frozen-lockfile --ignore-scripts

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: Argus-Tui
        run: bun install ${{ env.BUN_INSTALL_FLAGS }}

      - name: Create smoke artifacts directory
        working-directory: Argus-Tui/packages/opencode
        run: mkdir -p .artifacts/smoke

      - name: Run smoke tests
        working-directory: Argus-Tui/packages/opencode
        run: bun test --timeout 30000 test/argus/smoke.test.ts --reporter=junit --reporter-outfile=.artifacts/smoke/junit.xml

      - name: Upload smoke test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: Argus-Tui/packages/opencode/.artifacts/smoke/

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: Argus-Tui
        run: bun install ${{ env.BUN_INSTALL_FLAGS }}

      - name: TypeScript type check
        working-directory: Argus-Tui/packages/opencode
        run: bun typecheck

  lint-js:
    name: lint (javascript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: Argus-Tui
        run: bun install ${{ env.BUN_INSTALL_FLAGS }}

      - name: Run oxlint
        working-directory: Argus-Tui
        run: bun lint

  argus-unit:
    name: unit (linux)
    needs: [typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: Argus-Tui
        run: bun install ${{ env.BUN_INSTALL_FLAGS }}

      # The suite under test/argus/ spawns the real MCP worker for its
      # integration tests, so the worker's python dependencies must exist on
      # the runner. Without them the bridge cannot start and resume-flow fails
      # with ModuleNotFoundError instead of exercising the resume path. The
      # worker also reads its delegated tool definitions through PyYAML, which
      # lives in requirements-dev.txt.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python worker dependencies
        run: pip install -r argus-workers/requirements.txt -r argus-workers/requirements-dev.txt -q

      - name: Create artifacts directory
        working-directory: Argus-Tui/packages/opencode
        run: mkdir -p .artifacts/unit

      - name: Run argus unit tests
        working-directory: Argus-Tui/packages/opencode
        run: |
          bun test --timeout 30000 test/argus/ \
            --reporter=junit --reporter-outfile=.artifacts/unit/junit.xml \
            2>&1 | tee /tmp/unit-output.txt
          exit_code=${PIPESTATUS[0]}
          if [ "$exit_code" -ne 0 ]; then
            # Annotations are readable without an authenticated GitHub session.
            grep -E '^\(fail\)' /tmp/unit-output.txt | head -10 | while read -r line; do
              echo "::error title=argus unit::${line}"
            done
            grep -E '^ *[0-9]+ fail' /tmp/unit-output.txt | while read -r line; do
              echo "::error title=argus unit summary::${line}"
            done
          fi
          exit $exit_code

      - name: Run llm unit tests
        working-directory: Argus-Tui/packages/llm
        run: bun test --timeout 30000 2>&1 | tail -10

      - name: Run effect-drizzle-sqlite unit tests
        working-directory: Argus-Tui/packages/effect-drizzle-sqlite
        run: bun test --timeout 30000 2>&1 | tail -10

      - name: Run http-recorder unit tests
        working-directory: Argus-Tui/packages/http-recorder
        run: bun test --timeout 30000 2>&1 | tail -10

      - name: Publish unit reports
        if: always()
        uses: mikepenz/action-junit-report@bccf2e31636835cf0874589931c4116687171386
        with:
          report_paths: Argus-Tui/packages/opencode/.artifacts/unit/junit.xml
          check_name: "unit results (linux)"
          detailed_summary: true
          fail_on_failure: true

      - name: Upload unit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-linux-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: Argus-Tui/packages/opencode/.artifacts/unit/junit.xml

  argus-workers-lint:
    name: Python Workers (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus-workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff -q

      - name: Lint with ruff
        run: ruff check . --output-format=github

  python-tests:
    name: Python Workers (tests)
    needs: [argus-workers-lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus-workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev

      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -q

      - name: Run scope threading smoke test
        run: python ../scripts/livefire/validate-scope-threading.py

      - name: Run existing test suite (excluding DB/Redis/E2E)
        run: |
          python -m pytest tests/ -m "not requires_db and not requires_redis and not e2e and not docker" -v --timeout=120 --tb=long --junit-xml=python-test-results.xml 2>&1 | tee /tmp/pytest-output.txt; exit_code=${PIPESTATUS[0]}
          echo "---PYTEST EXIT CODE: $exit_code---"
          tail -100 /tmp/pytest-output.txt
          exit $exit_code

      - name: Upload python test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: argus-workers/python-test-results.xml

  graph-repository-db:
    name: Python Workers (graph repository, PostgreSQL)
    # The graph and delegation integration tests skip themselves unless
    # DATABASE_URL is reachable, so without a real Postgres in CI the graph and
    # delegation persistence layers are never exercised. This job provisions
    # Postgres, applies every migration (including 033 and 038) and runs the
    # tests so a skip cannot hide a broken query.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus-workers
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: argus_graph_test
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://argus:argus_test@localhost:5432/argus_graph_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev

      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -q

      - name: Apply migrations
        run: |
          python - <<'PY'
          import os

          import psycopg2

          from database.migrations.runner import run_migrations

          applied = run_migrations()
          print(f"Applied {len(applied)} migrations")

          expected = {
              "graph_assets",
              "graph_asset_observations",
              "graph_nodes",
              "graph_anchors",
              "graph_anchor_scopes",
              "graph_node_edges",
              "planner_frontier",
              "planner_todos",
              "planner_turns",
              "graph_outbox",
              "graph_actions",
              "graph_traces",
              "graph_write_rejections",
              "delegation_tasks",
              "delegation_subtasks",
              "delegation_actions",
              "delegation_patches",
              "delegation_reports",
              "delegation_memory",
              "control_plane_workers",
              "control_plane_leases",
              "control_plane_tasks",
              "control_plane_reason_checkpoints",
              "control_plane_bootstrap",
          }

          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          try:
              with conn, conn.cursor() as cur:
                  cur.execute(
                      "SELECT table_name FROM information_schema.tables "
                      "WHERE table_schema = 'public'"
                  )
                  found = {row[0] for row in cur.fetchall()}
                  cur.execute(
                      "SELECT indexname FROM pg_indexes "
                      "WHERE schemaname = 'public' "
                      "AND indexname = 'idx_graph_assets_scoped_identity'"
                  )
                  scoped_identity = cur.fetchone() is not None
                  cur.execute(
                      "SELECT table_name, column_name FROM information_schema.columns "
                      "WHERE table_schema = 'public' AND column_name = 'tenant_id' "
                      "AND table_name IN ('graph_assets', 'graph_asset_observations')"
                  )
                  tenant_columns = {row[0] for row in cur.fetchall()}
                  cur.execute(
                      "SELECT column_name FROM information_schema.columns "
                      "WHERE table_schema = 'public' AND table_name = 'graph_nodes' "
                      "AND column_name IN ('claim_token', 'lease_expires_at')"
                  )
                  intent_claim_columns = {row[0] for row in cur.fetchall()}
                  cur.execute(
                      "SELECT indexname FROM pg_indexes "
                      "WHERE schemaname = 'public' "
                      "AND indexname = 'idx_graph_nodes_claim_token'"
                  )
                  intent_claim_index = cur.fetchone() is not None
                  cur.execute(
                      "SELECT column_name FROM information_schema.columns "
                      "WHERE table_schema = 'public' "
                      "AND table_name = 'delegation_subtasks' "
                      "AND column_name = 'completion_condition'"
                  )
                  delegation_completion_column = cur.fetchone() is not None
                  cur.execute(
                      "SELECT table_name, column_name FROM information_schema.columns "
                      "WHERE table_schema = 'public' AND "
                      "((table_name = 'planner_todos' AND column_name IN "
                      "('claim_token', 'lease_expires_at', 'last_heartbeat_at')) "
                      "OR (table_name = 'graph_outbox' AND column_name = 'planner_turn_id'))"
                  )
                  planner_columns = {(row[0], row[1]) for row in cur.fetchall()}
                  cur.execute(
                      "SELECT indexname FROM pg_indexes "
                      "WHERE schemaname = 'public' "
                      "AND indexname = 'idx_planner_todos_claim_token'"
                  )
                  claim_index = cur.fetchone() is not None
          finally:
              conn.close()

          missing = sorted(expected - found)
          if missing:
              raise SystemExit(f"migrations did not create: {missing}")
          if not scoped_identity:
              raise SystemExit("migration 034 did not create the scoped asset identity index")
          if tenant_columns != {"graph_assets", "graph_asset_observations"}:
              raise SystemExit(
                  "migration 035 did not add tenant_id to both graph tables: "
                  f"{sorted(tenant_columns)}"
              )
          expected_planner_columns = {
              ("planner_todos", "claim_token"),
              ("planner_todos", "lease_expires_at"),
              ("planner_todos", "last_heartbeat_at"),
              ("graph_outbox", "planner_turn_id"),
          }
          unidentified = sorted(expected_planner_columns - planner_columns)
          if unidentified:
              raise SystemExit(
                  f"migration 036 did not add claim/turn columns: {unidentified}"
              )
          if not claim_index:
              raise SystemExit("migration 036 did not create the claim token index")
          if intent_claim_columns != {"claim_token", "lease_expires_at"}:
              raise SystemExit(
                  "migration 037 did not add intent claim columns: "
                  f"{sorted(intent_claim_columns)}"
              )
          if not intent_claim_index:
              raise SystemExit("migration 037 did not create the intent claim index")
          if not delegation_completion_column:
              raise SystemExit(
                  "migration 039 did not add the delegation completion condition column"
              )
          print("Graph tables present: " + ", ".join(sorted(expected)))
          PY

      - name: Check C-18 graph import boundary
        run: python scripts/check_graph_import_boundary.py

      - name: Run graph and delegation tests against PostgreSQL
        run: |
          python -m pytest tests/test_graph_repository.py \
            tests/test_graph_ingestion.py \
            tests/test_graph_planner.py \
            tests/test_task_delegation.py \
            tests/test_control_plane.py \
            tests/test_control_plane_bridge.py \
            tests/test_stage4_integration.py \
            -v --timeout=180 --tb=long --junit-xml=graph-repository-results.xml

      - name: Confirm graph tests did not skip
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("graph-repository-results.xml").getroot()
          suite = root.find("testsuite") if root.tag == "testsuites" else root
          skipped = int(suite.get("skipped", "0"))
          tests = int(suite.get("tests", "0"))
          print(f"graph repository tests: {tests} run, {skipped} skipped")
          if tests == 0:
              raise SystemExit("no graph repository tests were collected")
          if skipped:
              raise SystemExit(
                  f"{skipped} graph repository test(s) skipped — DATABASE_URL is not reachable"
              )
          PY

      - name: Upload graph repository results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-repository-results-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: argus-workers/graph-repository-results.xml

  collection-order-check:
    name: Python Workers (collection-order randomized)
    needs: [argus-workers-lint]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus-workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev

      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -q

      - name: Run tests with randomized file collection order (3 iterations)
        run: |
          python scripts/randomize_test_order.py \
            --iterations 3 \
            -- -m "not requires_db and not requires_redis and not e2e and not docker" \
            --timeout=120 -q

  python-tests-full:
    name: Python Workers (DB/Redis/E2E full suite)
    # Runs on schedule (nightly) and on workflow_dispatch to avoid blocking PRs
    # on infrastructure-dependent tests. Requires PostgreSQL and Redis service containers.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus-workers
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: argus_test
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev

      - name: Install test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -q

      - name: Run DB/Redis/E2E test suite
        env:
          ARGUS_DB_URL: postgresql://argus:argus_test@localhost:5432/argus_test
          ARGUS_REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/ \
            -m "requires_db or requires_redis or e2e" \
            -v --timeout=180 --tb=long \
            --junit-xml=python-full-test-results.xml 2>&1 | tee /tmp/pytest-full-output.txt; exit_code=${PIPESTATUS[0]}
          echo "---PYTEST EXIT CODE: $exit_code---"
          tail -100 /tmp/pytest-full-output.txt
          exit $exit_code

      - name: Upload full test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-full-test-results-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: argus-workers/python-full-test-results.xml

  tool-defs-check:
    name: Tool definitions consistency check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus-workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (PyYAML)
        run: pip install pyyaml -q

      - name: Check generated tools match YAML definitions
        run: python3 scripts/generate_tool_defs.py --check

      - name: Validate tool definition alignment (Python vs TUI)
        run: python3 scripts/validate_tool_alignment.py --check

  fixture-smoke:
    name: Python Workers (fixture smoke)
    # Run independently of python-tests — fixture smoke tests verify fixture web app
    # lifecycle and should report status even if the main test suite has failures.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus-workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('argus-workers/requirements.txt', 'argus-workers/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt -q

      - name: Run fixture smoke tests (excluding those requiring the full argus CLI)
        run: |
          python -m pytest tests/test_fixture_e2e_smoke.py \
            -m smoke -v --timeout=120 --log-cli-level=INFO

  fixture-full:
    name: Python Workers (fixture full matrix)
    # No `needs:` dependency on python-tests — nightly runs should detect
    # regressions independently. If unit tests fail, we still want to know
    # whether fixture tests pass or fail.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: argus-workers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('argus-workers/requirements.txt', 'argus-workers/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps
        run: pip install -r requirements.txt -r requirements-dev.txt -q

      - name: Run full fixture matrix
        run: |
          python -m pytest tests/test_fixture_comprehensive.py \
            tests/test_fixture_pipeline.py \
            tests/test_fixture_e2e_smoke.py \
            -m "full or smoke" -v --timeout=120 --log-cli-level=INFO

      - name: Upload fixture test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-full-report-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: argus-workers/reports/

  lockfile-sync:
    name: NPM lockfile sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: Argus-Tui
        run: bun install ${{ env.BUN_INSTALL_FLAGS }}

      - name: Generate package-lock.json from Bun's node_modules
        working-directory: Argus-Tui
        run: node scripts/generate-npm-lockfile.mjs

      - name: Verify package-lock.json is in sync
        run: |
          cd Argus-Tui
          STATUS=$(git status --porcelain -- package-lock.json)
          if [[ -n "$STATUS" ]]; then
            echo "ERROR: package-lock.json is out of sync with bun.lock"
            echo "Git status: $STATUS"
            echo "Run 'cd Argus-Tui && node scripts/generate-npm-lockfile.mjs' and commit the result."
            exit 1
          fi
          echo "package-lock.json is in sync."

  yaml-lint:
    name: YAML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml -q

      - name: Validate YAML files
        run: |
          failures=0
          while IFS= read -r -d '' f; do
            if python3 -c "import yaml; yaml.safe_load(open('$f')); print(f'  OK: $f')" 2>&1; then
              :
            else
              echo "  FAIL: $f"
              failures=$((failures + 1))
            fi
          done < <(find . \( -name "*.yaml" -o -name "*.yml" \) ! -path "*/node_modules/*" ! -path "*/.semgrep_cache/*" -print0 | sort -z)
          echo "---"
          if [ "$failures" -gt 0 ]; then
            echo "YAML validation: $failures file(s) FAILED"
            exit 1
          else
            echo "All YAML files valid."
          fi
