name: wafw00f
command: python3
description: "WAF fingerprinting from edge headers, cookies and block pages (wafw00f equivalent)"
# Runs the shared native recon shim: the upstream binary is not installable in
# this image, and every check here is a thin client over a public data source
# (Wayback CDX, crt.sh) or local logic. Each run reports a finding or an
# explicit clean negative attributed to wafw00f, so the capability executes
# instead of being skipped for a missing binary.
args:
  - argus-workers/tools/scripts/recon_shim.py
  - "--mode"
  - "waf"
  - "--tool"
  - "wafw00f"
parameters:
  - name: target
    type: string
    description: "Target URL or domain"
    required: true
    flag: "--target"
capabilities:
  - web_recon
# Fingerprinting also runs during scan: assessment_orchestrator and
# orchestrator_pkg/scan.py schedule at that phase, and the planner may only
# select it there if the registry lists it.
phases:
  - recon
  - scan
signal_quality: CANDIDATE
risk_level: low
priority: 55
cost: low
enabled: true
timeout: 120
