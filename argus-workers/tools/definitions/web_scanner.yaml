name: web_scanner
command: python3
args:
  - argus-workers/tools/run_agent_tool.py
  - web_scanner
description: "web_scanner - HTTP checks for SSRF, injection, redirects, API and header issues"
parameters:
  - name: target
    type: string
    description: "Target URL or scope"
    required: true
    flag: "--target"
  - name: extra
    type: string
    description: 'JSON-encoded extra parameters (e.g. {"tech_stack":["apache"]})'
    required: false
    flag: "--extra"
capabilities:
  - security_analysis
  - vulnerability_scanning
  - sqli_detection
  - ssrf_check
  - api_probing
signal_quality: PROBABLE
risk_level: low
priority: 80
cost: low
enabled: true
timeout: 300
