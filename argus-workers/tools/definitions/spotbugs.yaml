name: spotbugs
command: python3
description: "Java static analysis through the installed semgrep engine (spotbugs equivalent)"
args:
  - "argus-workers/tools/scripts/delegate_shim.py"
  - "--tool"
  - "spotbugs"
parameters:
  - name: target
    type: string
    description: "Filesystem path to scan"
    required: true
    flag: "--target"
phases:
  - repo_scan
capabilities:
  - sast
  - vulnerability_scanning
target_kind: path
requires:
  tech_contains:
    - "java"
    - "kotlin"
signal_quality: "PROBABLE"
risk_level: "low"
priority: 60
cost: "low"
timeout: 600
enabled: true
