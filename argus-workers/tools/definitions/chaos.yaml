name: chaos
command: python3
description: "Passive subdomain enumeration from HackerTarget, no API key (chaos equivalent)"
# The upstream binary is not installable in this image; the check runs through
# HackerTarget, which is provisioned by scripts/livefire/install-scanner-tools.sh.
# Results are attributed to this tool, so the capability executes instead of
# reporting a missing binary.
args:
  - argus-workers/tools/scripts/delegate_shim.py
  - "--tool"
  - "chaos"
parameters:
  - name: target
    type: string
    description: "Target URL or host"
    required: true
    flag: "--target"
capabilities:
  - web_recon
signal_quality: CANDIDATE
risk_level: low
priority: 30
cost: low
enabled: true
timeout: 240
