name: chaos
command: chaos
description: "ProjectDiscovery chaos data feed client for subdomain enumeration"
args:
  - "-json"
  - "-silent"
parameters:
  - name: target
    type: string
    description: "Target domain"
    required: true
    flag: "-d"
capabilities:
  - web_recon
signal_quality: CANDIDATE
risk_level: low
priority: 30
cost: low
enabled: true
timeout: 120
# chaos authenticates against ProjectDiscovery Cloud. Without the key it exits
# with "PDCP_API_KEY not specified" and produces nothing.
required_env:
  - PDCP_API_KEY
