name: phpcs
command: python3
description: "PHP static analysis through the installed semgrep engine (phpcs equivalent)"
# The upstream binary is not installable in this image; the check runs through
# semgrep p/php, which is provisioned by scripts/livefire/install-scanner-tools.sh.
# Results are attributed to this tool, so the capability executes instead of
# reporting a missing binary.
args:
  - argus-workers/tools/scripts/delegate_shim.py
  - "--tool"
  - "phpcs"
parameters:
  - name: target
    type: string
    description: "Filesystem path to scan"
    required: true
    flag: "--target"
capabilities:
  - sast
  - vulnerability_scanning
signal_quality: PROBABLE
risk_level: low
target_kind: path
priority: 60
cost: low
enabled: true
timeout: 600
