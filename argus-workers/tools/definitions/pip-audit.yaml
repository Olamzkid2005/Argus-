name: pip-audit
command: python3
description: "Python dependency CVE audit through the installed trivy scanner (pip-audit equivalent)"
# The upstream binary is not installable in this image; the check runs through
# trivy, which is provisioned by scripts/livefire/install-scanner-tools.sh.
# Results are attributed to this tool, so the capability executes instead of
# reporting a missing binary.
args:
  - argus-workers/tools/scripts/delegate_shim.py
  - "--tool"
  - "pip-audit"
parameters:
  - name: target
    type: string
    description: "Filesystem path to scan"
    required: true
    flag: "--target"
capabilities:
  - sca
  - vulnerability_scanning
signal_quality: CANDIDATE
risk_level: low
target_kind: path
priority: 55
cost: low
enabled: true
timeout: 300
