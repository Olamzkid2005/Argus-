name: pip-audit
command: python3
description: "Python dependency CVE audit through the installed trivy scanner (pip-audit equivalent)"
args:
  - "argus-workers/tools/scripts/delegate_shim.py"
  - "--tool"
  - "pip-audit"
parameters:
  - name: target
    type: string
    description: "Filesystem path to scan"
    required: false
    flag: "--target"
phases:
  - repo_scan
capabilities:
  - sca
  - vulnerability_scanning
target_kind: path
requires:
  tech_contains:
    - "python"
signal_quality: "CANDIDATE"
risk_level: "low"
priority: 55
cost: "low"
timeout: 300
enabled: true
