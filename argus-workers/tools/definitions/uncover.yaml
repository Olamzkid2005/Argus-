name: uncover
command: python3
description: "Exposure lookup from Shodan InternetDB, no API key (uncover equivalent)"
args:
  - "argus-workers/tools/scripts/delegate_shim.py"
  - "--tool"
  - "uncover"
parameters:
  - name: target
    type: string
    description: "Target URL or host"
    required: true
    flag: "--target"
phases:
  - recon
capabilities:
  - web_recon
signal_quality: "CANDIDATE"
risk_level: "low"
priority: 25
cost: "low"
timeout: 240
enabled: true
