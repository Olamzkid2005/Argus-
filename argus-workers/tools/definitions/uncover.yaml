name: uncover
command: python3
description: "Exposure lookup from Shodan InternetDB, no API key (uncover equivalent)"
# The upstream binary is not installable in this image; the check runs through
# Shodan InternetDB, which is provisioned by scripts/livefire/install-scanner-tools.sh.
# Results are attributed to this tool, so the capability executes instead of
# reporting a missing binary.
args:
  - argus-workers/tools/scripts/delegate_shim.py
  - "--tool"
  - "uncover"
parameters:
  - name: target
    type: string
    description: "Target URL or host"
    required: true
    flag: "--target"
capabilities:
  - web_recon
signal_quality: CANDIDATE
risk_level: low
priority: 25
cost: low
enabled: true
timeout: 240
