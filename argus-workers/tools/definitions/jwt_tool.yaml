name: jwt_tool
command: python3
description: "Passive JWT discovery and analysis (alg=none, expiry, sensitive claims)"
args:
  - argus-workers/tools/jwt_scan.py
# jwt_tool itself only analyses a token handed to it; without one it exited 1 and
# the api_exploitation phase reported jwt_analysis as never performed. This
# wrapper looks for tokens the target actually issues and reports on them;
# finding none is a result, not a failure.
parameters:
  - name: target
    type: string
    description: "Target URL"
    required: true
    flag: "--target"
capabilities:
  - jwt_analysis
signal_quality: PROBABLE
risk_level: low
priority: 70
cost: low
enabled: true
timeout: 120
