name: wpscan
command: python3
description: "Unauthenticated application probes through plain HTTP (delegated)"
args:
  - "argus-workers/tools/scripts/delegate_shim.py"
  - "--tool"
  - "wpscan"
parameters:
  - name: target
    type: string
    description: "Target base URL"
    required: true
    flag: "--target"
phases:
  - scan
capabilities:
  - web_recon
  - vulnerability_scanning
requires:
  tech_contains:
    - "wordpress"
    - "wp-"
signal_quality: "CANDIDATE"
risk_level: "low"
priority: 55
cost: "low"
timeout: 240
enabled: true
