name: cloud_enum
command: cloud_enum
description: "Cloud asset enumeration tool (AWS, Azure, GCP)"
# cloud_enum is argparse-based and has no --json; passing it produced
# "usage: cloud_enum [-h] (-k KEYWORD | -kf KEYFILE) ..." and no scan.
# The keyword is the only required input, so `-k <target>` alone is correct.
args: []
parameters:
  - name: target
    type: string
    description: "Target domain or keyword"
    required: true
    flag: "-k"
capabilities:
  - web_recon
  - cloud_enum
signal_quality: CANDIDATE
risk_level: low
priority: 30
cost: low
enabled: true
timeout: 300
