name: gospider
command: gospider
description: "Web spider for endpoint and parameter discovery"
args:
  - "-q"
  - "--json"
parameters:
  - name: target
    type: string
    description: "Target URL"
    required: true
    flag: "-s"
  - name: depth
    type: integer
    description: "Crawl depth"
    required: false
    flag: "-d"
    default: 3
capabilities:
  - content_discovery
  - web_recon
signal_quality: CANDIDATE
risk_level: low
priority: 55
cost: medium
# gospider v1.1.6 (provisioned by scripts/livefire/install-scanner-tools.sh)
# was tested with -v and does not segfault, so the phase is enabled.
enabled: true
timeout: 300
