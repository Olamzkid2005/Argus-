name: gospider
command: gospider
description: "Web spider for endpoint and parameter discovery"
args:
  - "-q"
  - "--json"
parameters:
  - name: target
    type: string
    description: "Target URL"
    required: true
    flag: "-s"
  - name: depth
    type: integer
    description: "Crawl depth"
    required: false
    flag: "-d"
    default: 3
capabilities:
  - content_discovery
  - web_recon
signal_quality: CANDIDATE
risk_level: low
priority: 55
cost: medium
# Not dispatchable here: the installed gospider build segfaults (SIGSEGV in an ioctl path under -v) and otherwise exits 0 with no output
disabled_reason: "the installed gospider build segfaults (SIGSEGV in an ioctl path under -v) and otherwise exits 0 with no output"
enabled: true
timeout: 300
