name: github-endpoints
command: python3
description: "Public repository search for target references, no token (github-endpoints equivalent)"
args:
  - "argus-workers/tools/scripts/delegate_shim.py"
  - "--tool"
  - "github-endpoints"
parameters:
  - name: target
    type: string
    description: "Target URL or host"
    required: true
    flag: "--target"
phases:
  - recon
capabilities:
  - web_recon
signal_quality: "CANDIDATE"
risk_level: "low"
priority: 30
cost: "low"
timeout: 240
enabled: true
