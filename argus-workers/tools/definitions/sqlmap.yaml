name: sqlmap
command: python3
description: "SQL injection detection (parameterised URLs, sqlmap or native probe)"
# Provisioned as a Python shim: the upstream binary is not installable in this
# environment (Ruby WhatWeb, the sn1per Bash framework), or needs a
# parameterised URL the engagement never supplies (sqlmap). Each shim runs the
# real tool when it exists and a native equivalent when it does not, and always
# reports either a finding or an explicit clean negative attributed to sqlmap.
args:
  - argus-workers/tools/scripts/sqlmap_shim.py
parameters:
  - name: target
    type: string
    description: "Target URL"
    required: true
    flag: "--target"
capabilities:
  - sqli_detection
signal_quality: CANDIDATE
risk_level: high
priority: 70
cost: medium
enabled: true
timeout: 240
