name: dnsx
command: dnsx
description: "Fast DNS resolver and probe tool"
args:
  - "-json"
  - "-silent"
parameters:
  - name: target
    type: string
    description: "Domain or subdomain list"
    required: true
    flag: "-d"
capabilities:
  - web_recon
signal_quality: CANDIDATE
risk_level: low
priority: 40
cost: low
# Not dispatchable here: needs a resolver list (-r) and a domain list; without them the installed build exits 0 having resolved nothing
disabled_reason: "needs a resolver list (-r) and a domain list; without them the installed build exits 0 having resolved nothing"
enabled: true
timeout: 120
