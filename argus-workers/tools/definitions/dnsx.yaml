name: dnsx
command: python3
description: "Fast DNS resolver and probe tool (supplies the resolver list and domain file dnsx requires)"
# dnsx refuses a bare domain (-d without -w) and resolves nothing without -r,
# so the definition runs a wrapper that writes the target to a domain list,
# passes public resolvers, and reports what resolved.
args:
  - argus-workers/tools/scripts/dnsx_shim.py
parameters:
  - name: target
    type: string
    description: "Domain or host to resolve"
    required: true
    flag: "--target"
capabilities:
  - web_recon
signal_quality: CANDIDATE
risk_level: low
priority: 40
cost: low
enabled: true
timeout: 120
