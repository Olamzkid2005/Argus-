name: whatweb
command: whatweb
description: "WhatWeb technology detection and fingerprinting"
# No default args: the installed whatweb accepts only a positional target.
# Ruby WhatWeb's --color=never/--log-json=FILE are rejected as unrecognized
# arguments, and the text line both builds print is handled by the parser.
args: []
parameters:
  - name: target
    type: string
    description: "Target URL to fingerprint"
    required: true
capabilities:
  - technology_detection
signal_quality: CANDIDATE
risk_level: low
priority: 75
cost: low
enabled: true
timeout: 120
