name: gitleaks
command: gitleaks
description: "Git repository secret scanning for hardcoded credentials"
args:
  - "detect"
  - "--no-git"
  - "--no-color"
  - "--report-format"
  - "json"
  - "--report-path"
  - "-"
parameters:
  - name: target
    type: string
    description: "Filesystem path or repository directory to scan (not a URL)"
    required: true
    flag: "--source"
  - name: max_target_mb
    type: integer
    description: "Max target size in MB"
    required: false
    flag: "--max-target-megabytes"
target_kind: path
capabilities:
  - secret_detection
signal_quality: CONFIRMED
risk_level: low
priority: 85
cost: medium
enabled: true
timeout: 300
