name: trufflehog
command: python3
description: "Secret scanning through the installed gitleaks engine (trufflehog equivalent)"
# The upstream binary is not installable in this image; the check runs through
# gitleaks, which is provisioned by scripts/livefire/install-scanner-tools.sh.
# Results are attributed to this tool, so the capability executes instead of
# reporting a missing binary.
args:
  - argus-workers/tools/scripts/delegate_shim.py
  - "--tool"
  - "trufflehog"
parameters:
  - name: target
    type: string
    description: "Filesystem path to scan"
    required: true
    flag: "--target"
capabilities:
  - secret_detection
  - vulnerability_scanning
signal_quality: PROBABLE
risk_level: low
target_kind: path
priority: 70
cost: low
enabled: true
timeout: 600
