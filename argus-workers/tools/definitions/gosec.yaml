name: gosec
command: python3
description: "Go static analysis through the installed semgrep engine (gosec equivalent)"
args:
  - "argus-workers/tools/scripts/delegate_shim.py"
  - "--tool"
  - "gosec"
parameters:
  - name: target
    type: string
    description: "Filesystem path to scan"
    required: true
    flag: "--target"
phases:
  - repo_scan
capabilities:
  - sast
  - vulnerability_scanning
target_kind: path
requires:
  tech_contains:
    - "go"
signal_quality: "PROBABLE"
risk_level: "low"
priority: 65
cost: "low"
timeout: 600
enabled: true
