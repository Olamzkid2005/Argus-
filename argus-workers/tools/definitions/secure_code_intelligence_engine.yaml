name: secure_code_intelligence_engine
command: python3
args:
  - argus-workers/tools/run_agent_tool.py
  - secure_code_intelligence_engine
description: "Unified source-code security analysis: secrets, SAST and dependency scanning"
# Serves the source_analysis phase: ai-surface now probes live HTTP targets, so the
# static source scan is this engine (agent-internal, run via run_agent_tool.py).
phases:
  - source_analysis
  - analyze
  - repo_scan
parameters:
  - name: target
    type: string
    description: "Target URL or scope"
    required: true
    flag: "--target"
  - name: extra
    type: string
    description: 'JSON-encoded extra parameters (e.g. {"tech_stack":["apache"]})'
    required: false
    flag: "--extra"
capabilities:
  - security_analysis
  - sast
signal_quality: CONFIRMED
risk_level: low
priority: 90
cost: low
enabled: true
timeout: 600
