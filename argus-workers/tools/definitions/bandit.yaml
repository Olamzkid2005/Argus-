name: bandit
command: python3
description: "Python static analysis through the installed semgrep engine (bandit equivalent)"
args:
  - "argus-workers/tools/scripts/delegate_shim.py"
  - "--tool"
  - "bandit"
parameters:
  - name: target
    type: string
    description: "Filesystem path to scan"
    required: true
    flag: "--target"
phases:
  - repo_scan
capabilities:
  - sast
  - vulnerability_scanning
target_kind: path
requires:
  tech_contains:
    - "python"
signal_quality: "PROBABLE"
risk_level: "low"
priority: 70
cost: "low"
timeout: 300
enabled: true
