name: ai-surface
command: python3
description: "Unauthenticated AI attack-surface probes over HTTP (delegated)"
args:
  - "argus-workers/tools/scripts/delegate_shim.py"
  - "--tool"
  - "ai-surface"
parameters:
  - name: target
    type: string
    description: "Target base URL"
    required: true
    flag: "--target"
phases:
  - recon
capabilities:
  - web_recon
  - ai_surface_mapping
signal_quality: "CANDIDATE"
risk_level: "low"
priority: 45
cost: "low"
timeout: 240
enabled: true
