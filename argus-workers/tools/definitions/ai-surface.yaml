name: ai-surface
command: python3
description: "Unauthenticated application probes through plain HTTP (delegated)"
# The upstream binary/Ruby gem is not installable here; the credential-free checks it
# performed are HTTP requests, so they run through delegate_shim.py and are
# attributed to this tool instead of reporting a missing binary.
args:
  - argus-workers/tools/scripts/delegate_shim.py
  - "--tool"
  - "ai-surface"
parameters:
  - name: target
    type: string
    description: "Target base URL"
    required: true
    flag: "--target"
capabilities:
  - web_recon
  - discovery
signal_quality: CANDIDATE
risk_level: low
priority: 45
cost: low
enabled: true
timeout: 240
