name: commix
command: commix
description: "Command injection detection tool"
args:
  - "--batch"
  # Without crawling commix reports "No parameter(s) found for testing" and
  # exits 0, so the phase counted command_injection as never performed.
  - "--crawl=2"
parameters:
  - name: target
    type: string
    description: "Target URL"
    required: true
    flag: "--url"
capabilities:
  - command_injection
signal_quality: PROBABLE
requires:
  recon_signals:
    - has_file_upload
priority: 70
cost: medium
risk_level: high
enabled: true
timeout: 300
